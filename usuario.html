    <h2>Ingresar tu usuario</h2>
    <form action="#">
        <fieldset>
            <legend>Inicio de sesión</legend>
            <label for="dni">Documento DNI</label>
            <input type="text" id="dni" name="dni" placeholder="Ingrese su DNI" required>
            <br><br>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
            <br><br>
            <label for="select">Ciudad</label>
            <select id="select" name="ciudad" required>
                <option>Selecciona tu ciudad</option>
                <option value="buenos-aires">Buenos Aires</option>
                <option value="rosario">Rosario</option>
                <option value="mendoza">Mendoza</option>
            </select>
            <button type="submit">Iniciar sesión</button>
    </form>
